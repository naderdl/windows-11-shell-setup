# ============================================================
# STARSHIP CONFIGURATION
# Clean / Spaceship-inspired / emoji-based
# ============================================================

add_newline = true

scan_timeout = 30
command_timeout = 1000

format = '$username$hostname$directory$git_branch$git_commit$git_state$git_status$nodejs$deno$python$dotnet${custom.aspire}$rust${custom.docker}$package$cmd_duration$status$line_break$character'


# ============================================================
# USER
# Only appears when elevated / SSH / unusual user context
# ============================================================

[username]
show_always = false

style_user = 'bold yellow'
style_root = 'bold red'

format = '[$user]($style)@'


# ============================================================
# HOST
# Shows the current device name
# ============================================================

[hostname]
ssh_only = false

trim_at = ''

style = 'bold blue'

format = '[💻 $hostname]($style) '


# ============================================================
# DIRECTORY
# ============================================================

[directory]
style = 'bold cyan'

format = '[📁 $path]($style)'

home_symbol = '~'

truncation_length = 4
truncate_to_repo = false

read_only = ' 🔒'
read_only_style = 'bold red'


# ============================================================
# GIT BRANCH
# ============================================================

[git_branch]
symbol = '🌿 '

style = 'bold purple'

format = ' [$symbol$branch(:$remote_branch)]($style)'

truncation_length = 32
truncation_symbol = '…'


# ============================================================
# GIT COMMIT
# Only appears for detached HEAD
# ============================================================

[git_commit]
commit_hash_length = 7

only_detached = true

tag_disabled = false
tag_symbol = ' 🏷️ '

style = 'bold green'

format = ' [🔗 $hash$tag]($style)'


# ============================================================
# GIT STATE
# Rebase / merge / cherry-pick / bisect etc.
# ============================================================

[git_state]
style = 'bold yellow'

format = ' [🔄 $state( $progress_current/$progress_total)]($style)'


# ============================================================
# GIT STATUS
# Compact but complete
# ============================================================

[git_status]
style = 'bold yellow'

format = ' [$all_status$ahead_behind]($style)'

conflicted = '⚔${count} '

stashed = '📦${count} '

modified = '~${count} '

staged = '+${count} '

renamed = '»${count} '

deleted = '✘${count} '

untracked = '?${count} '

ahead = '↑${count} '

behind = '↓${count} '

diverged = '↕↑${ahead_count}↓${behind_count} '

up_to_date = ''
# ============================================================
# NODE.JS
# Only appears in Node projects
# Automatically suppressed by Starship in Deno projects
# ============================================================

[nodejs]
symbol = '🟢 '

style = 'bold green'
not_capable_style = 'bold red'

version_format = 'v${raw}'

format = ' [$symbol Node $version]($style)'


# ============================================================
# DENO
# ============================================================

[deno]
symbol = '🦕 '

style = 'bold cyan'

version_format = 'v${raw}'

format = ' [$symbol Deno $version]($style)'


# ============================================================
# PYTHON
# Shows active virtual environment when present
# ============================================================

[python]
symbol = '🐍 '

style = 'bold yellow'

version_format = 'v${raw}'

python_binary = ['python', 'python3']

format = ' [$symbol Python $version( \($virtualenv\))]($style)'


# ============================================================
# .NET
# Shows SDK + target framework when detectable
# ============================================================

[dotnet]
symbol = '🟣 '

style = 'bold blue'

version_format = 'v${raw}'

heuristic = true

format = ' [$symbol .NET $version( 🎯 $tfm)]($style)'

# ============================================================
# ASPIRE
# Repo-wide detection
# ============================================================

[custom.aspire]
description = 'Aspire'

symbol = '🚀 '
style = 'bold magenta'

shell = ['pwsh.exe', '-NoProfile', '-Command', '-']

command = "(aspire --version).Split('+')[0]"

when = '''
$root = git rev-parse --show-toplevel 2>$null

if ($LASTEXITCODE -eq 0 -and $root) {
    $aspireFiles = git -C $root ls-files -- `
        ':(glob)**/*AppHost.csproj' `
        ':(glob)**/*Aspire*.csproj' `
        ':(glob)**/aspire.config.json' `
        ':(glob)**/apphost.cs' `
        ':(glob)**/apphost.mts'

    if ($aspireFiles) {
        exit 0
    }
}

# Fallback for a standalone/non-git Aspire project
if (
    (Get-ChildItem -File -Filter '*AppHost.csproj' -ErrorAction SilentlyContinue) -or
    (Get-ChildItem -File -Filter '*Aspire*.csproj' -ErrorAction SilentlyContinue) -or
    (Test-Path 'aspire.config.json') -or
    (Test-Path 'apphost.cs') -or
    (Test-Path 'apphost.mts')
) {
    exit 0
}

exit 1
'''

format = ' [$symbol Aspire $output]($style)'

# ============================================================
# RUST
# ============================================================

[rust]
symbol = '🦀 '

style = 'bold red'

version_format = 'v${raw}'

format = ' [$symbol Rust $version( $toolchain)]($style)'

# ============================================================
# DOCKER
# Shows Docker context even when it is desktop-linux/default
# ============================================================

[custom.docker]
description = 'Docker'

symbol = '🐳 '

style = 'bold blue'

shell = ['pwsh.exe', '-NoProfile', '-Command', '-']

command = 'docker context show'

detect_files = [
    'Dockerfile',
    'compose.yml',
    'compose.yaml',
    'docker-compose.yml',
    'docker-compose.yaml'
]

format = ' [$symbol Docker:$output]($style)'

# ============================================================
# PACKAGE VERSION
# ============================================================

[package]
symbol = '📦 '

style = 'bold 208'

version_format = 'v${raw}'

display_private = true

format = ' [$symbol$version]($style)'

# ============================================================
# COMMAND DURATION
# Only appears when a command takes >= 2 seconds
# ============================================================

[cmd_duration]
min_time = 500
show_milliseconds = true
style = 'bold yellow'
format = ' [⏱ $duration]($style)'

# ============================================================
# COMMAND FAILURE STATUS
# ============================================================

[status]
disabled = false

symbol = '❌ '

not_executable_symbol = '🚫 '
not_found_symbol = '🔍 '
sigint_symbol = '🛑 '

success_symbol = ''

style = 'bold red'

format = ' [$symbol$status]($style)'

# ============================================================
# PROMPT
# ============================================================

[character]
success_symbol = '[❯](bold green) '

error_symbol = '[❯](bold red) '

vimcmd_symbol = '[❮](bold green) '
vimcmd_replace_one_symbol = '[❮](bold purple) '
vimcmd_replace_symbol = '[❮](bold purple) '
vimcmd_visual_symbol = '[❮](bold yellow) '
